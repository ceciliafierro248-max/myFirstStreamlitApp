name: Deploy Streamlit to GitHub Pages
on:
  push:
    branches: [ main ] # Change to master if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert Streamlit to Static HTML
        run: |
          # CRITICAL: Replace 'main.py' below with your actual root Python filename 
          # (e.g., app.py, streamlit_app.py) if it is named differently!
          npx @stlite/mountable@latest export code.py
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
