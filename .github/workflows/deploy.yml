name: Deploy Streamlit to GitHub Pages
on:
  push:
    branches: [ main ] # Change to master if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Convert Streamlit to Static HTML
        run: |
          npx @stlite/mountable@latest export code.py # Replace main.py with your app's filename if different
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
